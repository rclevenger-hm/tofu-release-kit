name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check Python and workflow syntax
        run: |
          python -m pip install ruff==0.16.10
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python scripts/install_actionlint.py
          .tools/actionlint
          bash -n scripts/aws_delivery.sh
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and policy engine
        run: |
          python -m pip install .
          python scripts/install_tools.py
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Test CLI, policies, and all demo outcomes
        run: make check
      - name: Build installable distributions
        run: |
          python -m pip install 'setuptools==84.0.0'
          python -c "from setuptools.build_meta import build_sdist, build_wheel; build_sdist('dist'); build_wheel('dist')"
          python scripts/check_wheel.py
  opentofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned tools
        run: |
          python scripts/install_tools.py --tofu
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Validate reference infrastructure without cloud credentials
        run: |
          python scripts/package_lambda.py
          tofu fmt -check -recursive examples
          tofu -chdir=examples/aws-serverless init -backend=false -input=false -lockfile=readonly
          tofu -chdir=examples/aws-serverless validate
          tofu -chdir=examples/aws-serverless test
          python scripts/check_local_lab.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tofu-release-kit:test
      - name: Smoke-test the packaged CLI and policy engine
        run: |
          docker run --rm tofu-release-kit:test --version
          mkdir -p .artifacts/container
          chmod 777 .artifacts/container
          docker run --rm -v "$PWD:/work:ro" -v "$PWD/.artifacts/container:/results" tofu-release-kit:test \
            gate --plan tests/fixtures/safe-plan.json --config examples/demo/release-kit.toml \
            --output /results/policy.json
