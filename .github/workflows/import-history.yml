name: Import documented initial history

on:
  push:
    branches: [main]
    paths: ['history/import.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: initial-history-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'rclevenger-hm/tofu-release-kit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and attach the documented import
        run: |
          git config user.name 'Roger Clevenger'
          git config user.email '70983614+rclevenger-hm@users.noreply.github.com'
          python scripts/import_history.py --push
