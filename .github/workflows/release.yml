name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributions:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify release version and test
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install . 'build>=1,<2'
          python -c 'import os; from tofu_release_kit import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__'
          python scripts/install_tools.py --tofu
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Validate release
        run: |
          make check
          python scripts/package_lambda.py
          tofu -chdir=examples/aws-serverless init -backend=false -input=false -lockfile=readonly
          tofu -chdir=examples/aws-serverless validate
          tofu -chdir=examples/aws-serverless test
          python -m build
          python scripts/check_wheel.py
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*'
      - name: Create draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "Tofu Release Kit $RELEASE_TAG" --notes-file RELEASE_NOTES.md
