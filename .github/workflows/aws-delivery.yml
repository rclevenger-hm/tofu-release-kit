name: AWS reference delivery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-reference-sandbox
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-2' }}
  TF_VAR_owner: ${{ vars.INFRA_OWNER || github.repository_owner }}
  TF_VAR_environment: sandbox
  TF_VAR_application_revision: ${{ github.sha }}
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install .
          python scripts/install_tools.py --tofu
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Plan, evaluate policy, and seal plan
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          STATE_KEY: ${{ vars.STATE_KEY }}
          STATE_KMS_KEY_ID: ${{ vars.STATE_KMS_KEY_ID }}
          TRK_PLAN_KEY: ${{ secrets.TRK_PLAN_KEY }}
        run: bash scripts/aws_delivery.sh plan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: encrypted-reviewed-plan
          path: .artifacts/plan.gpg
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Publish review summary
        if: always()
        run: |
          if test -f .artifacts/review.md; then cat .artifacts/review.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Remove private intermediate data
        if: always()
        run: rm -rf .artifacts/private
  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install .
          python scripts/install_tools.py --tofu
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: encrypted-reviewed-plan
          path: .artifacts
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validate binding, apply, and verify readiness
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          STATE_KEY: ${{ vars.STATE_KEY }}
          STATE_KMS_KEY_ID: ${{ vars.STATE_KMS_KEY_ID }}
          TRK_PLAN_KEY: ${{ secrets.TRK_PLAN_KEY }}
        run: bash scripts/aws_delivery.sh apply
      - name: Publish deployment summary
        if: always()
        run: |
          if test -f .artifacts/deployment.md; then cat .artifacts/deployment.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: deployment-report
          path: |
            .artifacts/deployment.json
            .artifacts/deployment.md
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: Remove private intermediate data
        if: always()
        run: rm -rf .artifacts/private
