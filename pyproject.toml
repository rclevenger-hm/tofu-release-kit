[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tofu-release-kit"
version = "0.1.0"
description = "Review OpenTofu changes, enforce policy, and verify deployed services"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Roger Clevenger"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
tofu-release-kit = "tofu_release_kit.cli:main"

[project.urls]
Repository = "https://github.com/rclevenger-hm/tofu-release-kit"
Issues = "https://github.com/rclevenger-hm/tofu-release-kit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tofu_release_kit = ["policies/*.rego"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
