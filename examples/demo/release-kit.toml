schema_version = 1
stack = "orders-api"
environment = "demo"

[policies]
required_tags = ["owner", "environment"]
protected_resources = ["aws_dynamodb_table.orders"]

[[verification]]
name = "health"
url_from_output = "health_url"
revision_from_output = "application_revision"
timeout_seconds = 2
request_timeout_seconds = 1
interval_seconds = 0.1
allow_http = true
