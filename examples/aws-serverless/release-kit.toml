schema_version = 1
stack = "readiness-api"
environment = "sandbox"

[policies]
required_tags = ["owner", "environment"]
protected_resources = ["aws_dynamodb_table.orders"]

[[verification]]
name = "application-ready"
url_from_output = "health_url"
revision_from_output = "application_revision"
timeout_seconds = 120
request_timeout_seconds = 5
interval_seconds = 3
